name: Verificar y desplegar

# Cada push a main: se verifica el código y, si todo pasa, el VPS hace git pull y reconstruye los contenedores.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar (tipos, pruebas y build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend (tipos y pruebas)
        working-directory: backend
        run: |
          npm ci
          npm run typecheck:all
          npm test

      - name: Frontend (tipos y build)
        working-directory: frontend
        run: |
          npm ci
          npm run build

  desplegar:
    name: Desplegar en el VPS
    needs: verificar
    runs-on: ubuntu-latest
    # Un despliegue a la vez y sin cancelar uno en curso: interrumpir un docker compose a la mitad deja el servidor a medias.
    concurrency:
      group: despliegue-vps
      cancel-in-progress: false
    steps:
      - name: Preparar SSH
        env:
          CLAVE: ${{ secrets.VPS_SSH_KEY }}
          HOSTS_CONOCIDOS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # La huella del servidor viene de un secreto: así no se acepta a ciegas cualquier máquina en esa IP.
          printf '%s\n' "$HOSTS_CONOCIDOS" > ~/.ssh/known_hosts

      - name: Actualizar y reconstruir
        env:
          USUARIO: ${{ secrets.VPS_USER }}
          HOST: ${{ secrets.VPS_HOST }}
          RUTA: ${{ secrets.VPS_PATH }}
        run: ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USUARIO@$HOST" "cd '$RUTA' && ./deploy/actualizar.sh"
