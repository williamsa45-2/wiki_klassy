server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los documentos llegan hasta MAX_ARCHIVO_MB (50 por defecto): el tope cubre el archivo más el sobrecosto del formulario multipart.
    # Si subes MAX_ARCHIVO_MB en .env, sube este número también.
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://backend:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Los archivos pasan directo al backend sin guardarse en disco en nginx.
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://backend:4100/health;
    }

    # Archivos de Vite con hash en el nombre: se pueden cachear sin límite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta del frontend (/documentos/..., /admin/...) la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
